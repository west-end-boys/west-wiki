openapi: 3.1.0
info:
  title: West Wiki API
  version: 0.1.0
  description: Initial campaign and character-management API slice backed by the event-sourced KB.
servers:
  - url: /
paths:
  /campaign:
    get:
      summary: Get the current campaign projection
      responses:
        '200':
          description: Current viewer-safe campaign projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /characters:
    get:
      summary: List current character projections owned by the current player
      responses:
        '200':
          description: Character projections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CharacterSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      summary: Create a draft character
      description: Validates the command and records the resulting accepted event(s) in the KB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCharacterRequest'
      responses:
        '201':
          description: Draft character created; response is the resulting current projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterCommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /characters/{characterId}:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      summary: Get the current character projection
      responses:
        '200':
          description: Current viewer-safe character projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /characters/{characterId}/edit:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    post:
      summary: Propose player-managed character edits
      description: Character edits are recorded as accepted correction/fact events; existing KB events are never mutated in place.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditCharacterRequest'
      responses:
        '200':
          description: Edit accepted; response is the resulting current projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterCommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/DomainValidation'
  /characters/{characterId}/activate:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    post:
      summary: Activate a draft character
      description: Validates activation against current projections and records the resulting accepted event(s) in the KB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateCharacterRequest'
      responses:
        '200':
          description: Character activated; response is the resulting current projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterCommandResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/DomainValidation'
  /characters/{characterId}/retire:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    post:
      summary: Retire a character
      description: Validates retirement and records the resulting accepted event(s) in the KB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetireCharacterRequest'
      responses:
        '200':
          description: Character retired; response is the resulting current projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterCommandResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/DomainValidation'
  /characters/{characterId}/availability:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
    get:
      summary: Get derived character availability for a date
      responses:
        '200':
          description: Derived availability from current projected state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterAvailability'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /locations:
    get:
      summary: List current location projections visible to the caller
      parameters:
        - name: startingLocation
          in: query
          required: false
          schema:
            type: boolean
          description: When true, return only locations whose current projection allows character activation.
      responses:
        '200':
          description: Viewer-safe location projections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
components:
  parameters:
    CharacterId:
      name: characterId
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthenticated:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Caller is not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource not found or not visible to caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Current projected campaign state conflicts with the requested command
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    DomainValidation:
      description: Request is structurally valid but fails domain validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    CampaignView:
      type: object
      required: [id, name, gameSystem, timezone, characterRules, downtimeRules]
      properties:
        id: { type: string }
        name: { type: string }
        gameSystem: { type: string }
        timezone: { type: string }
        characterRules:
          type: object
          required: [maxRosterSize, activationPolicy]
          properties:
            maxRosterSize: { type: integer, minimum: 0 }
            activationPolicy:
              type: string
              enum: [AUTOMATIC, GM_APPROVAL]
        downtimeRules:
          type: object
          required: [maxActivitiesBetweenExpeditions]
          properties:
            maxActivitiesBetweenExpeditions: { type: integer, minimum: 0 }
    LocationSummary:
      type: object
      required: [id, name, allowsCharacterActivation]
      properties:
        id: { type: string }
        name: { type: string }
        allowsCharacterActivation: { type: boolean }
    CharacterSummary:
      type: object
      required: [id, name, lifecycleStatus, countsAgainstRosterLimit]
      properties:
        id: { type: string }
        name: { type: string }
        lifecycleStatus:
          $ref: '#/components/schemas/CharacterLifecycleStatus'
        currentLocation:
          $ref: '#/components/schemas/LocationSummary'
        countsAgainstRosterLimit: { type: boolean }
    CharacterDetail:
      allOf:
        - $ref: '#/components/schemas/CharacterSummary'
        - type: object
          required: [campaignId, ownerUserId, gameSystem, gameData, createdAt]
          properties:
            campaignId: { type: string }
            ownerUserId: { type: string }
            gameSystem: { type: string }
            gameData:
              type: object
              additionalProperties: true
            createdAt: { type: string, format: date-time }
            retiredAt: { type: string, format: date-time }
    CharacterLifecycleStatus:
      type: string
      enum: [DRAFT, ACTIVE, MISSING, RETIRED, DEAD, ARCHIVED]
    CreateCharacterRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        gameData:
          type: object
          additionalProperties: true
    EditCharacterRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        gameData:
          type: object
          additionalProperties: true
      minProperties: 1
    ActivateCharacterRequest:
      type: object
      required: [startingLocationId]
      properties:
        startingLocationId: { type: string }
    RetireCharacterRequest:
      type: object
      required: [locationId]
      properties:
        locationId: { type: string }
        narrative: { type: string }
    CharacterCommandResult:
      type: object
      required: [character]
      properties:
        character:
          $ref: '#/components/schemas/CharacterDetail'
        eventIds:
          type: array
          items: { type: string }
    CharacterAvailability:
      type: object
      required: [characterId, date, available, reasons]
      properties:
        characterId: { type: string }
        date: { type: string, format: date }
        available: { type: boolean }
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityReason'
    AvailabilityReason:
      oneOf:
        - type: object
          required: [code]
          properties:
            code: { const: AVAILABLE }
        - type: object
          required: [code]
          properties:
            code: { const: NOT_ACTIVE }
        - type: object
          required: [code]
          properties:
            code: { const: MISSING }
        - type: object
          required: [code, commitmentId]
          properties:
            code: { const: BLOCKING_COMMITMENT }
            commitmentId: { type: string }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - ROSTER_LIMIT_REACHED
            - INVALID_STARTING_LOCATION
            - CHARACTER_NOT_DRAFT
            - CHARACTER_NOT_ELIGIBLE
            - COMMITMENT_CONFLICT
            - DOWNTIME_LIMIT_REACHED
            - DOMAIN_VALIDATION_FAILED
            - KB_WRITE_REJECTED
            - KB_UNAVAILABLE
            - INTERNAL_ERROR
        message: { type: string }
        details:
          type: object
          additionalProperties: true
